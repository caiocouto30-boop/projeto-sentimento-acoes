name: Conferência do artigo
on:
  push:
    branches: [validacao-artigo-728c304]
permissions:
  contents: read
jobs:
  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-notebook.txt
      - run: python tools/executar_artigo.py --modo kernel --pasta notebooks
      - run: python tools/verificar_notebook.py
      - run: python tools/exportar_artigo.py
  interacao:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright
      - name: Conferir manchetes com o Chrome offline
        shell: python
        run: |
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import shutil
          
          with sync_playwright() as pw:
              browser = pw.chromium.launch(executable_path=shutil.which("google-chrome"))
              page = browser.new_page(viewport={"width": 1440, "height": 1000}, offline=True)
              page.goto(Path("artigo_interativo.html").resolve().as_uri())
              for n in range(1, 8):
                  page.locator(f"#grafico-q{n} svg.marks").first.wait_for()
          
              def conferir(numero, campo="manchete_exemplo", minimo=1, painel=0):
                  grafico = page.locator(f"#grafico-q{numero}")
                  grupo = grafico.locator(".mark-symbol.role-mark").nth(painel)
                  grupo.scroll_into_view_if_needed()
                  # Escolhe pela geometria e pelo alvo real do ponteiro, inclusive em pontos sobrepostos.
                  ponto = grupo.evaluate("""(g, args) => {
                    for (const p of g.querySelectorAll('path')) {
                      const d = p.__data__?.datum;
                      if (!d || !d[args.campo] || d.n_noticias < args.minimo) continue;
                      const b = p.getBoundingClientRect();
                      const x = b.x+b.width/2, y = b.y+b.height/2;
                      if (document.elementFromPoint(x,y) === p)
                          return {x, y, titulo:d[args.campo], restantes:d.outras_manchetes};
                    }
                  }""", {"campo": campo, "minimo": minimo})
                  assert ponto, f"Q{numero}, sem ponto acessível ao ponteiro"
                  page.mouse.move(1, 1)
                  page.mouse.move(ponto["x"], ponto["y"])
                  tip = page.locator("#vg-tooltip-element")
                  tip.wait_for(state="visible")
                  tip.get_by_text(ponto["titulo"], exact=True).wait_for()
                  if minimo > 3:
                      linha = tip.locator("tr").filter(has_text="Outras manchetes no grupo")
                      assert linha.locator("td").last.inner_text() == str(ponto["restantes"])
                  print(f"Q{numero}, painel {painel+1}: {ponto['titulo']}", flush=True)
          
              seletor = page.locator("#grafico-q3 select")
              seletor.select_option(label="NFLX")
              page.wait_for_function("""() => document.querySelector('#grafico-q3 .mark-symbol.role-mark path')?.__data__?.datum?.stock === 'NFLX'""")
              conferir(3, "manchete_1", 4)
              conferir(4)
              conferir(5)
              conferir(5, painel=1)
              page.locator("#grafico-q5 select").last.select_option(label="Intensidade média = média(|s|)")
              conferir(5, painel=1)
              conferir(6)
              # Verifica se arrastar a faixa inferior restringe as datas do painel principal.
              pontos_q3 = page.locator("#grafico-q3 .mark-symbol.role-mark").first.locator("path")
              total = pontos_q3.count()
              faixa = page.locator("#grafico-q3 .mark-symbol.role-mark").nth(1)
              faixa.scroll_into_view_if_needed()
              limites = faixa.bounding_box()
              y = limites["y"] + limites["height"] / 2
              x = limites["x"]
              largura = limites["width"]
              page.mouse.move(x + 0.25 * largura, y)
              page.mouse.down()
              page.mouse.move(x + 0.55 * largura, y, steps=10)
              page.mouse.up()
              page.wait_for_function("""total => {const n=document.querySelector('#grafico-q3 .mark-symbol.role-mark').querySelectorAll('path').length;return n>0 && n<total}""", arg=total)
              print(f"Q3: seleção temporal reduziu {total} pontos para {pontos_q3.count()}.", flush=True)
          
              # A célula do mapa corresponde a uma empresa e um período.
              mapa = page.locator("#grafico-q6 .mark-rect.role-mark path")
              indice = mapa.evaluate_all("""ps => ps.findIndex(p=>p.__data__.datum.stock==='NFLX' && p.__data__.datum.periodo==='2019')""")
              assert indice >= 0
              mapa.nth(indice).click(position={"x": 5, "y": 5})
              page.wait_for_function("""() => {
                  const ps=[...document.querySelectorAll('#grafico-q6 .mark-symbol.role-mark path')];
                  return ps.length>0 && ps.every(p=>p.__data__.datum.stock==='NFLX' && p.__data__.datum.periodo==='2019')
              }""")
              conferir(6)
              cenarios = page.locator("#grafico-q7 .mark-symbol.role-mark path").evaluate_all("""ps => [...new Set(ps.map(p=>p.__data__.datum.cenario))]""")
              assert set(cenarios) == {"Principal","Mínimo 3","Sem retrospectivas","Sem retrospectivas + mínimo 3"}
              print("Q7: quatro cenários presentes nas marcas renderizadas.", flush=True)
              browser.close()
